<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{% block title %}Club El Pato{% endblock %}</title>
  <link rel="manifest" href="{{ manifest_href }}">
  <meta name="theme-color" content="#2f4858">
  <link rel="stylesheet" href="/static/css/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <main class="app-container {% block main_class %}{% endblock %}">
    {% for categoria, mensaje in get_flashed_messages(with_categories=true) %}
    <p class="{{ 'error' if categoria == 'error' else 'msg-ok' }}">{{ mensaje }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/static/sw.js");
    }
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
